name: Verify draft release candidate
run-name: FileMint candidate ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        required: true
        type: string
      release_id:
        required: true
        type: string
      tag:
        required: true
        type: string
      commit:
        required: true
        type: string
      build:
        required: true
        type: string
      assets:
        required: true
        type: string
# Draft Release access requires a repository identity with push access.
# No Apple or Sparkle private key is provided to this verification job.
permissions:
  contents: write
jobs:
  verify:
    name: Verify draft DMG and Sparkle installer
    runs-on: macos-15
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      FILEMINT_PUBLICATION_INPUTS: ${{ toJSON(inputs) }}
      APPLE_TEAM_ID: 8S66M2ZLD5
      APPLE_CODESIGN_IDENTITY: 'Developer ID Application: Guangzhou Guangbei Vertex Technology co.,Ltd (8S66M2ZLD5)'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Verify the exact uploaded draft candidate
        run: python3 scripts/release_publication.py candidate
