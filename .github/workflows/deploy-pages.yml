name: Deploy verified FileMint website
run-name: FileMint deploy ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        required: true
        type: string
      release_id:
        required: true
        type: string
      tag:
        required: true
        type: string
      commit:
        required: true
        type: string
      build:
        required: true
        type: string
      assets:
        required: true
        type: string
      build_run_id:
        required: true
        type: string
      build_request_id:
        required: true
        type: string
      artifact_id:
        required: true
        type: string
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Confirm publication and fetch the exact verified website build
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          FILEMINT_PUBLICATION_INPUTS: ${{ toJSON(inputs) }}
        run: python3 scripts/release_publication.py deploy
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
      # Same reviewed upload-artifact revision used by upload-pages-artifact.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: pages_upload
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: ${{ steps.candidate.outputs.archive }}
          if-no-files-found: error
      - name: Wait for the uploaded Pages artifact
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.pages_upload.outputs.artifact-id }}
        # An upload can finish before GitHub includes it in its artifact listings.
        run: |
          : "${PAGES_ARTIFACT_ID:?Missing Pages artifact ID from upload}"
          for delay in 2 4 8 16 30; do
            sleep "$delay"
            ids=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              -f "name=$PAGES_ARTIFACT_NAME" \
              --jq '.artifacts[] | if .expired == false then .id else "expired" end')
            case "$ids" in
              "$PAGES_ARTIFACT_ID") exit 0 ;;
              '') continue ;;
              *) echo "::error::Unexpected or ambiguous Pages artifact for $PAGES_ARTIFACT_NAME"; exit 1 ;;
            esac
          done
          echo "::error::GitHub did not list Pages artifact $PAGES_ARTIFACT_ID after upload"
          exit 1
      - name: Deploy the verified artifact without rebuilding
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
