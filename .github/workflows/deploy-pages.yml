name: Deploy verified FileMint website
run-name: FileMint deploy ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        required: true
        type: string
      release_id:
        required: true
        type: string
      tag:
        required: true
        type: string
      commit:
        required: true
        type: string
      build:
        required: true
        type: string
      assets:
        required: true
        type: string
      build_run_id:
        required: true
        type: string
      build_request_id:
        required: true
        type: string
      artifact_id:
        required: true
        type: string
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Confirm publication and fetch the exact verified website build
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          FILEMINT_PUBLICATION_INPUTS: ${{ toJSON(inputs) }}
        run: python3 scripts/release_publication.py deploy
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
      # Same reviewed upload-artifact revision used by upload-pages-artifact.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: ${{ steps.candidate.outputs.archive }}
          if-no-files-found: error
      - name: Deploy the verified artifact without rebuilding
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
