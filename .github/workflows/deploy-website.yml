name: Deploy website-only update
run-name: ${{ inputs.release_commit && format('FileMint catchup {0}', inputs.request_id) || format('FileMint website deploy {0}', github.event.workflow_run.head_sha || inputs.commit) }}
on:
  workflow_run:
    workflows: [Build FileMint website]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: Current main commit containing the website update
        required: false
        type: string
      build_run_id:
        description: Successful main-push Build FileMint website run
        required: false
        type: string
      artifact_id:
        description: Exact unexpired github-pages artifact from that run
        required: false
        type: string
      release_id:
        description: Current published stable Latest application Release ID
        required: true
        type: string
      release_commit:
        description: Published release commit for automatic main-push catch-up
        required: false
        type: string
      request_id:
        description: Publisher journal request identity for catch-up
        required: false
        type: string
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.repository == 'FileMintApp/FileMint' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.x'
          check-latest: true
      - name: Show deployment Node version
        run: node --version
      - name: Verify the public release and fetch the successful website build
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_COMMIT: ${{ inputs.commit }}
          SITE_BUILD_RUN_ID: ${{ inputs.build_run_id }}
          SITE_ARTIFACT_ID: ${{ inputs.artifact_id }}
          SITE_RELEASE_ID: ${{ inputs.release_id }}
          SITE_RELEASE_COMMIT: ${{ inputs.release_commit }}
          SITE_REQUEST_ID: ${{ inputs.request_id }}
        run: node website/scripts/prepare-deployment.mjs
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        if: steps.candidate.outputs.ready == 'true'
        with:
          enablement: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: pages_upload
        if: steps.candidate.outputs.ready == 'true'
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: ${{ steps.candidate.outputs.archive }}
          if-no-files-found: error
      - name: Wait for the uploaded Pages artifact
        if: steps.candidate.outputs.ready == 'true'
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.pages_upload.outputs.artifact-id }}
        # An upload can finish before GitHub includes it in its artifact listings.
        run: |
          : "${PAGES_ARTIFACT_ID:?Missing Pages artifact ID from upload}"
          for delay in 2 4 8 16 30; do
            sleep "$delay"
            ids=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              -f "name=$PAGES_ARTIFACT_NAME" \
              --jq '.artifacts[] | if .expired == false then .id else "expired" end')
            case "$ids" in
              "$PAGES_ARTIFACT_ID") exit 0 ;;
              '') continue ;;
              *) echo "::error::Unexpected or ambiguous Pages artifact for $PAGES_ARTIFACT_NAME"; exit 1 ;;
            esac
          done
          echo "::error::GitHub did not list Pages artifact $PAGES_ARTIFACT_ID after upload"
          exit 1
      - name: Deploy the verified website without rebuilding
        if: steps.candidate.outputs.ready == 'true'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
