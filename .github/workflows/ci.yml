name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-macos:
    name: Verify core behavior (${{ matrix.os }}, arm64)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.x'
          check-latest: true
          package-manager-cache: false
      - name: Show runner and toolchain
        run: |
          sw_vers
          uname -m
          test "$(uname -m)" = arm64
          xcodebuild -version
          swift --version
          node --version
      - name: Verify deterministic behavior
        run: make verify
      - name: Verify GitHub token authentication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/verify_github_token.py
      - name: Ensure XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version
      - name: Compile unsigned app and Finder extension
        env:
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGNING_REQUIRED: "NO"
        run: |
          make build
          CI_APP=build/DerivedData/Build/Products/Release/FileMint.app
          test -x "$CI_APP/Contents/MacOS/FileMint"
          test -x "$CI_APP/Contents/PlugIns/FileMintFinderSync.appex/Contents/MacOS/FileMintFinderSync"

  verify:
    # Preserve the required-check name; each matrix job now requires tests and compilation.
    name: Verify core behavior
    needs: verify-macos
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every macOS environment to pass
        env:
          VERIFY_RESULT: ${{ needs.verify-macos.result }}
        run: |
          if [[ "$VERIFY_RESULT" != success ]]; then
            echo "macOS verification did not succeed: $VERIFY_RESULT"
            exit 1
          fi
