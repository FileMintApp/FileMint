name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Verify and package universal app
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Verify deterministic behavior
        run: make verify
      - name: Package and verify both architectures
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: make package
      - name: Keep reviewable DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FileMint-${{ github.sha }}
          path: |
            build/FileMint-*.dmg
            build/FileMint-*.dmg.sha256
  provenance:
    name: Attest trusted branch build
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: FileMint-${{ github.sha }}
          path: dist
      - name: Attest final DMG
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*.dmg
      - name: Verify GitHub provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify dist/*.dmg --repo "$GITHUB_REPOSITORY"
