name: Sync fork from upstream

on:
  schedule:
    # Run once a day without competing with the top-of-hour Actions load.
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: fork-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream into fork
    # This workflow is copied into forks with the upstream source. Never run
    # the write step in FileMintApp/FileMint itself.
    if: ${{ github.event.repository.fork == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SYNC_TOKEN_CONFIGURED: ${{ secrets.FORK_SYNC_TOKEN != '' }}
    steps:
      - name: Check out the fork default branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)
        with:
          ref: ${{ github.event.repository.default_branch }}
          # The built-in token cannot push changes to .github/workflows.
          token: ${{ secrets.FORK_SYNC_TOKEN || github.token }}
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch upstream changes
        env:
          UPSTREAM_REPOSITORY: FileMintApp/FileMint
          UPSTREAM_BRANCH: main
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"

      - name: Merge upstream changes
        id: sync
        env:
          UPSTREAM_BRANCH: main
        run: |
          set -euo pipefail
          echo "changed=false" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # A normal merge preserves commits made in the fork. A conflict
          # stops the job before push so a maintainer can resolve it manually.
          before_sync=$(git rev-parse HEAD)
          echo "before_sync=$before_sync" >> "$GITHUB_OUTPUT"
          if ! git merge --no-edit "upstream/${UPSTREAM_BRANCH}"; then
            echo "Upstream merge failed; inspect the conflict details above."
            git status --short
            exit 1
          fi
          after_sync=$(git rev-parse HEAD)

          if [[ "$before_sync" == "$after_sync" ]]; then
            echo "Fork is already up to date."
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Check workflow update permission
        if: ${{ steps.sync.outputs.changed == 'true' && env.SYNC_TOKEN_CONFIGURED != 'true' }}
        env:
          BEFORE_SYNC: ${{ steps.sync.outputs.before_sync }}
        run: |
          set -euo pipefail
          workflow_commits=$(git rev-list --full-history "${BEFORE_SYNC}..HEAD" -- .github/workflows/)
          if [[ -n "$workflow_commits" ]]; then
            echo "::error title=Fork sync token required::Upstream commits change .github/workflows. Configure the FORK_SYNC_TOKEN secret in this fork with Contents and Workflows read/write permissions. See docs/FORK_SYNC.md for setup and the one-time manual sync."
            exit 1
          fi

      - name: Push merge to fork
        if: ${{ steps.sync.outputs.changed == 'true' }}
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Dispatch fork CI after sync
        # A dedicated-token push to main already triggers ci.yml. The built-in
        # token and other default branches still need an explicit dispatch.
        # A manual run can retry CI dispatch after a previous post-push
        # dispatch failure, even when the fork is already current.
        if: ${{ (steps.sync.outputs.changed == 'true' && (env.SYNC_TOKEN_CONFIGURED != 'true' || github.event.repository.default_branch != 'main')) || (steps.sync.outputs.changed != 'true' && github.event_name == 'workflow_dispatch') }}
        env:
          GH_TOKEN: ${{ github.token }}
          CI_WORKFLOW: ci.yml
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          gh workflow run "$CI_WORKFLOW" \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$TARGET_BRANCH"
